name: Automated Code Review

on:
  pull_request:
    branches: [ "main" ]

jobs:
  review:
    name: Checkstyle & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Quan trọng: Để Bot có quyền comment vào PR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Bước 1: Chạy Test (Nếu test fail, job sẽ dừng và nút Merge sẽ bị khóa)
      - name: Run Tests
        run: mvn test

      # Bước 2: Chạy Checkstyle và Reviewdog để comment trực tiếp vào PR
      - name: Checkstyle Review
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: warning # Hoặc 'error' tùy mức độ nghiêm khắc
          reporter: github-pr-review # Đẩy lỗi thành inline comment
          filter_mode: added # Chỉ báo lỗi trên những dòng code mới thay đổi